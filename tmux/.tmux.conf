# ==============================================================================
# TMUX CONFIGURATION (.tmux.conf) - Dotfiles
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Configurações Gerais & Cores
# ------------------------------------------------------------------------------
# Suporte a 24-bit True Color e terminais modernos
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-256color:RGB"

# Prefixo ergonômico: Ctrl+a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Iniciar contagem de janelas e painéis em 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Mouse ativo e comportamento de encerramento
set -g mouse on
set -g detach-on-destroy off

# Posição da barra no topo
set -g status-position top

# Zero delay no Escape (essencial para agilidade no Vim/Neovim)
set -s escape-time 0

# Histórico generoso de rolagem
set -g history-limit 10000

# ------------------------------------------------------------------------------
# 2. Ergonomia, Splits e Mentalidade Vi
# ------------------------------------------------------------------------------
# Ativar modo Vi para navegação e cópia
setw -g mode-keys vi

# Recarregar configurações facilmente: prefix + r
bind r source-file ~/.tmux.conf \; display-message "Tmux recarregado com sucesso!"

# Preservar o diretório atual em novos splits e janelas
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Redimensionamento de painéis estilo Vi (prefix + H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Atalhos Vi para Copy-Mode (v para selecionar, y para copiar)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard 2>/dev/null || wl-copy 2>/dev/null"

# ------------------------------------------------------------------------------
# 3. Diferenciação Visual de Painéis
# ------------------------------------------------------------------------------
set -g pane-border-style "fg=#313244"
# Mauve (#cba6f7) quando normal, Peach/Yellow (#f9e2af) quando em zoom [Z]
set -g pane-active-border-style "#{?window_zoomed_flag,fg=#f9e2af,fg=#cba6f7}"

# ------------------------------------------------------------------------------
# 4. Plugins (TPM)
# ------------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.1.2'
# Navegação entre painéis/nvim com Ctrl+Shift+h/j/k/l (desabilita os defaults do plugin)
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @vim_navigator_mapping_left  "C-H"
set -g @vim_navigator_mapping_down  "C-J"
set -g @vim_navigator_mapping_up    "C-K"
set -g @vim_navigator_mapping_right "C-L"
set -g @vim_navigator_mapping_prev  ""
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Opções do tema Catppuccin Mocha
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'

# Opções de restauração automática do continuum
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# ------------------------------------------------------------------------------
# 5. Bootstrap Automático do TPM & Inicialização
# ------------------------------------------------------------------------------
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Inicializa o TPM
run '~/.tmux/plugins/tpm/tpm'

# Configuração da barra de status (após o carregamento dos módulos do Catppuccin)
set -g status-left " "
set -g status-left-length 100
set -g status-right-length 100
set -g status-right " #{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"

# Padding vertical (linha em branco de respiro abaixo da barra de status)
set -g status 2
set -g status-format[1] ''
